line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W"]
# Line length is a formatter's job; the wizard's dialogue lines are intentionally long.
ignore = ["E501"]

[lint.per-file-ignores]
# Original upstream standalone demo — not part of the wellness system. Left untouched
# so merges with the original repo stay clean.
"demo/demo_life_os.py" = ["F401", "F841"]
